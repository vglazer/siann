site_name: siann
site_description: Fast similarity search on Apple silicon, and a benchmark of the Mac's compute backends
repo_url: https://github.com/vglazer/siann
docs_dir: docs/src        # filled by docs/prepare.sh from the pages at the top of the repository
theme:
  name: material
nav:
  - Home: README.md
  - Implementation: IMPLEMENTATION.md
  - Backends: BACKENDS.md
  - Datasets: DATASETS.md
  - Benchmarks: BENCHMARKS.md
  - Tuning: TUNING.md
  - Development: DEVELOPMENT.md
  - API reference: API.md
markdown_extensions:
  - tables
  - pymdownx.superfences:   # renders the Mermaid diagrams in IMPLEMENTATION.md
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
  - mkdocstrings:           # the API reference (API.md), read from the sources without importing siann
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: null       # siann's docstrings are prose
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            members_order: source
            filters: ["!^_"]
            heading_level: 3
