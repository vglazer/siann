site_name: siann
site_description: Fast similarity search on Apple silicon, and a benchmark of the Mac's compute backends
repo_url: https://github.com/vglazer/siann
docs_dir: docs/src        # filled by docs/prepare.sh from the pages at the top of the repository
theme:
  name: material
nav:
  - Home: README.md
  - Implementation: IMPLEMENTATION.md
  - Backends: BACKENDS.md
  - Datasets: DATASETS.md
  - Benchmarks: BENCHMARKS.md
  - Tuning: TUNING.md
  - Development: DEVELOPMENT.md
markdown_extensions:
  - tables
  - pymdownx.superfences:   # renders the Mermaid diagrams in IMPLEMENTATION.md
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
