name: CPU benchmark on Linux

# Runs benchmarks/x86_cpu.py (siann's CPU path against FAISS: exact search by four metrics, and the IVF at a
# recall target against FAISS's IVF-Flat and HNSW at matched recall) on GitHub's Linux runners. On x86-64 it
# builds siann twice and runs both on the same machine: for x86-64-v3 (AVX2 and FMA), as the published
# wheels are built, against FAISS; and for baseline x86-64, siann alone, to show what the newer
# instructions add. The ARM runner runs the published build. Results go in the run's summary and as an
# artifact. Run it by hand (Actions > CPU benchmark on Linux > Run workflow).

on:
  workflow_dispatch:
    inputs:
      n:
        description: base vectors
        default: "200000"

permissions:
  contents: read

jobs:
  bench:
    name: Benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, x86: true }
          - { os: ubuntu-24.04-arm, x86: false }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build siann as the published wheels are built
        env:
          RUSTFLAGS: ${{ matrix.x86 && '-C target-cpu=x86-64-v3' || '' }}
        run: |
          python -m pip install maturin
          maturin build --release --out dist-published
          python -m venv published && published/bin/pip install dist-published/*.whl faiss-cpu
      - name: Build siann for baseline x86-64
        if: matrix.x86
        run: |
          cargo clean --manifest-path crates/siann-py/Cargo.toml
          maturin build --release --out dist-baseline
          python -m venv baseline && baseline/bin/pip install dist-baseline/*.whl faiss-cpu
      - name: Benchmark the published build
        working-directory: benchmarks
        run: |
          ../published/bin/python x86_cpu.py --n ${{ inputs.n }} | tee ../published.txt
          { echo '### ${{ matrix.os }}, published build'; echo '```'; cat ../published.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Benchmark the baseline x86-64 build
        if: matrix.x86
        working-directory: benchmarks
        run: |
          ../baseline/bin/python x86_cpu.py --n ${{ inputs.n }} --siann-only | tee ../baseline.txt
          { echo '### ${{ matrix.os }}, baseline x86-64 build'; echo '```'; cat ../baseline.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: cpu-bench-${{ matrix.os }}
          path: "*.txt"
