[package]
name = "siann_cpu"
version = "0.0.0"
edition = "2024"
publish = false
description = "Prototype: exact L1 k-nearest neighbors on the CPU, for proto/backends.py"

[lib]
crate-type = ["cdylib"]

[dependencies]
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
rayon = "1.12.0"

[profile.release]
codegen-units = 1
