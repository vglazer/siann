[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "siann"
description = "Fast similarity search on Apple silicon, across metrics"
readme = "README.md"
license = "MIT"
authors = [{ name = "Victor Glazer" }]
requires-python = ">=3.12"
# MLX, siann's GPU backend, runs only on Apple silicon; elsewhere siann searches on the CPU
dependencies = ["numpy>=2.5.5", "mlx>=0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/vglazer/siann"
Documentation = "https://siann.readthedocs.io"
Repository = "https://github.com/vglazer/siann"

[project.optional-dependencies]
torch = ["torch>=2.15.0"]

[dependency-groups]
# the tests in python/tests
dev = ["pytest>=8", "scipy>=1.13", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.8"]
# the benchmarks and checks in benchmarks/: FAISS as the baseline, the other frameworks, the datasets
bench = [
    "faiss-cpu>=1.16.0",
    "h5py>=3.16.0",
    "hnswlib>=0.8.0",  # searches mlxvs's GPU-built graphs on the CPU
    "mlxvs>=0.16.1",  # the GPU baseline (cuVS methods on MLX)
    "torch>=2.15.0",
]
# Just ruff, so that CI can lint without building the package
lint = ["ruff==0.17.5"]

[tool.maturin]
manifest-path = "crates/siann-py/Cargo.toml"
python-source = "python"
module-name = "siann._cpu"
features = ["pyo3/extension-module"]

[tool.uv]
# rebuild the Rust extension when its sources change
cache-keys = [{ file = "pyproject.toml" }, { file = "crates/siann-py/Cargo.toml" }, { file = "crates/siann-py/src/**/*.rs" },
              { file = "crates/siann/Cargo.toml" }, { file = "crates/siann/src/**/*.rs" }]

[tool.ruff.lint]
# Ruff's defaults, plus sorted imports
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# The benchmarks time closures over loop variables, each called in the iteration that defines it
"benchmarks/**" = ["B023"]

[tool.ruff.lint.isort]
known-first-party = ["siann"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
