[package]
name = "siann-py"
version = "0.4.1"
edition = "2024"
publish = false
description = "siann's CPU paths in Rust (exact search, IVF, the BLAS top-k), built into the siann Python package as siann._cpu"

[lib]
name = "_cpu"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py312"] }
rayon = "1.12.0"
siann = { path = "../siann" }

[profile.release]
codegen-units = 1
