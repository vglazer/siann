[package]
name = "siann"
version = "0.3.1"
edition = "2024"
# The engine of the siann Python package, which ships it inside its wheels; not published (the crates.io
# name holds a placeholder, 0.0.1).
publish = false
description = "siann's CPU search in plain Rust: exact and IVF k-nearest neighbors for L1, L2, L-infinity and inner product"
license = "MIT"
readme = "README.md"
repository = "https://github.com/vglazer/siann"

[dependencies]
rayon = "1.12.0"
